name: Run CI

on:
  push:
    branches: [ "main" ]

  pull_request:

permissions:
  contents: read

# Pants 2.33 runs on CPython 3.14; the plugin tests get theirs from the
# python_build_standalone provider (pants.toml), so no system Python is set up.

jobs:
  test:
    strategy:
      matrix:
        pants-version: ["2.33.1"]
        platform: ["macos-14", "ubuntu-latest"]
        shard: [0, 1, 2]

    runs-on: "${{ matrix.platform }}"

    steps:
    - uses: actions/checkout@v4

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        # cache0 makes it easy to bust the cache if needed
        gha-cache-key: cache2-test-pants${{ matrix.pants-version }}-${{ matrix.platform }}-${{ matrix.shard }}
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Test everything
      run: |
        pants test --shard="${{ matrix.shard }}/3" ::

  package:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pants-version: ["2.33.1"]

    steps:
    - uses: actions/checkout@v4

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache3-package-pants${{ matrix.pants-version }}
        named-caches-hash: ${{ hashFiles('pants-plugins/**/*') }}

    - name: Package all targets
      run: |
        set -euxo
        pants package ::
        [[ $(dist/examples.hello-world/hello-world) = "Hello, world!" ]] || exit 1

  check-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache3-lint
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Run linters on all targets
      run: |
        pants update-build-files --check lint ::

  validate-tailor:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache3-tailor
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Validate that tailor files are up to date
      run: |
        pants tailor --check ::

  summarize:
    needs:
    - package
    - check-and-lint
    - validate-tailor
    - test

    runs-on: ubuntu-latest
    if: success()

    outputs:
      success: ${{ steps.setoutput.outputs.success }}
    steps:
    - id: setoutput
      run: echo "success=true" >> $GITHUB_OUTPUT

  ci:
    runs-on: ubuntu-latest
    if: always() # always run, so we never skip the check
    needs:
    - summarize
    steps:
    - run: |
        passed="${{needs.summarize.outputs.success}}"
        if [[ $passed == "true" ]]; then
          echo "CI succeeded"
          exit 0
        else
          echo "CI failed"
          exit 1
        fi
