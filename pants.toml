[GLOBAL]
pants_version = "2.33.1"

pythonpath = ["%(buildroot)s/pants-plugins/cargo-porcelain"]
# The porcelain's own dependencies, for the backend loaded from source above, spelled as in
# pants-plugins/cargo-porcelain/pyproject.toml.
plugins = [
  "pants_backend_cc @ git+https://github.com/tgolsson/pants-backends@12372aaa9c7a#subdirectory=pants-plugins/cc",
  "pants_backend_platforms @ git+https://github.com/tgolsson/pants-backends@12372aaa9c7ac8781d68547daedd26492bf6fdaf#subdirectory=pants-plugins/platforms",
]

backend_packages = [
  "pants.backend.python",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.plugin_development",
  "pants.backend.python.lint.black",
  "pants.backend.python.lint.flake8",
  "pants.backend.python.lint.isort",
  # Pants 2.33 runs on CPython 3.14, which the plugin tests therefore need too.
  "pants.backend.python.providers.experimental.python_build_standalone",
  "pants.backend.shell",
  "pants.backend.tools.taplo",

  "pants_cargo_porcelain",
  "pants_cargo_porcelain.backends.clippy",
]

pants_ignore = [".*/", "/dist/", "__pycache__", "**/pdm_build.py"]

[python]
tailor_pex_binary_targets = true
interpreter_constraints = ["==3.14.*"]
enable_resolves = true
default_resolve = "pants-plugins"

[python.resolves]
pants-plugins = "pants-plugins/pants.lock"

pytest = "locks/tools/pytest.lock"
isort = "locks/tools/isort.lock"
ipython = "locks/tools/ipython.lock"
black = "locks/tools/black.lock"

[python.resolves_to_interpreter_constraints]
pants-plugins = ["==3.14.*"]
pytest = ["==3.14.*"]
black = [">=3.9,<3.10"]
isort = [">=3.9,<3.10"]
ipython = [">=3.9,<3.10"]

[black]
install_from_resolve = "black"
interpreter_constraints = ["==3.9.*"]

[ipython]
install_from_resolve = "ipython"

[isort]
install_from_resolve = "isort"
args = '--resolve-all-configs'
interpreter_constraints = ["==3.9.*"]
config = "['pyproject.toml']"

[pytest]
args = ["--no-header"]
execution_slot_var = "TEST_EXECUTION_SLOT"
install_from_resolve = "pytest"

[source]
root_patterns = []
marker_filenames = ["pyproject.toml"]

[anonymous-telemetry]
enabled = false

[rustup]
rust_version = "1.97.0"

[clippy]
args = ["--", "-Dwarnings"]
