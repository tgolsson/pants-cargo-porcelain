[project]
name = "pants_cargo_porcelain"
description = "A Pants backend for Rust that wraps Cargo: cargo_workspace and cargo_package targets, a hermetic toolchain, kache-cached builds, and package, run, test, fmt and lint through cargo."
version = "0.4.0"
authors = [{ name = "Tom Solberg", email = "me@sbg.dev" }]
requires-python = ">=3.11"

license = { file = "LICENSE-APACHE" }
keywords = ["pantsbuild", "pants"]

classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Topic :: Software Development :: Build Tools",
]

dependencies = [
  # Abbreviated SHA on purpose: see the comment in BUILD.
  "pants_backend_cc @ git+https://github.com/tgolsson/pants-backends@5060ff485a3e#subdirectory=pants-plugins/cc",
  "pants_backend_platforms @ git+https://github.com/tgolsson/pants-backends@5060ff485a3e401980ef539b46d93575cedff568#subdirectory=pants-plugins/platforms",
]

[project.urls]
Repository = "https://github.com/tgolsson/pants-cargo-porcelain"
Code = "https://github.com/tgolsson/pants-cargo-porcelain/tree/main/pants-plugins/cargo-porcelain"
Changelog = "https://github.com/tgolsson/pants-cargo-porcelain/tree/main/CHANGELOG.md"

[tool.pdm.build]
includes = ["pants_cargo_porcelain"]
excludes = ["**/BUILD"]

[build-system]
requires = ["pdm-backend>=1.0.0"]
build-backend = "pdm.backend"


[tool.black]
line-length = 100
preview = true

[tool.isort]
profile = "black"
line_length = 100
color_output = true
known_first_party = ["pants_cargo_porcelain"]
include_trailing_comma = true
